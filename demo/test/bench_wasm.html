<!doctype html>
<meta charset="utf-8">
<title>wasm vs hand-rolled JS decode</title>
<pre id="out">running...</pre>
<script type="module">
// Is it cheaper to decode a cell's records in wasm, or in the hand-rolled
// JavaScript that demo/index.html carries?
//
// The JS copy exists only because nobody wired the wasm decoders up, and every
// format bug this codebase has had came from the two drifting apart. Before
// deleting the JS, measure: if crossing the wasm boundary per cell costs more
// than the decode saves, the right answer is "wasm owns parsing, JS keeps a
// thin path", not a clean sweep.
//
// Synthetic records, so this measures decode and the boundary crossing only --
// no network, no zstd, deterministic.
import init, { decode_signals } from "../lib/client/ptiles_client.js";

const log = (s) => { document.getElementById("out").textContent += s + "\n"; };

// PTILESS v1: osm_id zigzag-delta varint, lon i32, lat i32, type u8, flags u8.
function synth(n) {
  const b = [];
  let prev = 0;
  for (let i = 0; i < n; i++) {
    const osm = prev + 1000 + (i % 97);
    let zz = BigInt((osm - prev) * 2);
    prev = osm;
    // varint
    let v = Number(zz);
    do { let byte = v & 0x7f; v >>>= 7; if (v) byte |= 0x80; b.push(byte); } while (v);
    const lon = Math.round((-86.78 + (i % 100) * 1e-4) * 1e5);
    const lat = Math.round((36.16 + (i % 100) * 1e-4) * 1e5);
    b.push(lon & 255, (lon >> 8) & 255, (lon >> 16) & 255, (lon >> 24) & 255);
    b.push(lat & 255, (lat >> 8) & 255, (lat >> 16) & 255, (lat >> 24) & 255);
    b.push(i % 5);       // signal_type
    b.push(0);           // flags
  }
  return new Uint8Array(b);
}

// The copy that ships in demo/index.html today.
function decodeVarint(data, start) {
  let shift = 0, value = 0, pos = start;
  for (;;) {
    const byte = data[pos++];
    value |= (byte & 0x7f) << shift;
    if (!(byte & 0x80)) break;
    shift += 7;
  }
  return { value, consumed: pos - start };
}
const SIGNAL_TYPES = ["traffic_signals","crossing_signals","stop","give_way","railway_signals"];
function jsDecode(raw) {
  const out = [];
  let p = 0, prev = 0;
  while (p < raw.length) {
    const d = decodeVarint(raw, p); p += d.consumed;
    prev += (d.value >> 1) ^ -(d.value & 1);
    const lon = raw[p] | raw[p+1]<<8 | raw[p+2]<<16 | raw[p+3]<<24; p += 4;
    const lat = raw[p] | raw[p+1]<<8 | raw[p+2]<<16 | raw[p+3]<<24; p += 4;
    const st = raw[p++], fl = raw[p++];
    let dir = null;
    if (fl & 0x01) { dir = raw[p] | raw[p+1]<<8; p += 2; }
    out.push({ osmId: prev, lat: lat/1e5, lon: lon/1e5,
               signalType: SIGNAL_TYPES[st] || ("unknown(" + st + ")"), direction: dir });
  }
  return out;
}

function time(fn, iters) {
  fn(); // warm
  const t0 = performance.now();
  for (let i = 0; i < iters; i++) fn();
  return (performance.now() - t0) / iters;
}

await init();

// A real dense cell holds a few hundred records; downtown ring-1 averaged ~84
// per cell over 7 cells, and the largest run to ~500.
for (const n of [20, 100, 500, 2000]) {
  const buf = synth(n);
  const iters = n > 500 ? 200 : 2000;
  const js = time(() => jsDecode(buf), iters);
  const wa = time(() => decode_signals(buf), iters);

  // Same answer, or the comparison is meaningless.
  const a = jsDecode(buf), b = decode_signals(buf);
  let same = a.length === b.length;
  if (same) {
    for (let i = 0; i < a.length; i++) {
      const x = a[i], y = b[i];
      if (x.signalType !== y.signal_type ||
          Math.abs(x.lat - y.lat) > 1e-9 || Math.abs(x.lon - y.lon) > 1e-9) {
        same = false; break;
      }
    }
  }
  log(`${String(n).padStart(5)} records   js ${js.toFixed(4)} ms   wasm ${wa.toFixed(4)} ms   ` +
      `${(js / wa).toFixed(2)}x   agree=${same}`);
}
log("done");
</script>
