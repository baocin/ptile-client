[package]
name = "ptiles-wasm"
version = "0.1.0"
edition = "2021"
description = "wasm-bindgen exports, thin wrapper over ptiles-core"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ptiles-core = { path = "../core", features = ["serde"] }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
serde = { version = "1", features = ["derive"] }
ruzstd = { version = "0.8.3", default-features = false }
