<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PTILES wasm demo</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    background: #0d1117; color: #e6edf3;
  }
  .topbar {
    display: flex; align-items: center; gap: 8px; padding: 8px 14px;
    background: #161b22; border-bottom: 1px solid #30363d; flex-wrap: wrap;
  }
  .topbar h1 { font-size: 1rem; margin: 0; font-weight: 600; white-space: nowrap; }
  select, input, button { font: inherit; font-size: 0.82rem; }
  select {
    background: #0d1117; border: 1px solid #30363d; border-radius: 6px;
    color: #e6edf3; padding: 5px 8px;
  }
  input {
    background: #0d1117; border: 1px solid #30363d; border-radius: 6px;
    color: #e6edf3; padding: 6px 10px; width: 200px;
  }
  button {
    background: #238636; color: #fff; border: none; border-radius: 6px;
    padding: 6px 12px; cursor: pointer; font-weight: 600;
  }
  button:hover { background: #2ea043; }
  #status { color: #8b949e; font-size: 0.75rem; margin-left: auto; }
  .layer-bar {
    display: flex; align-items: center; gap: 14px; padding: 6px 14px;
    background: #0d1117; border-bottom: 1px solid #30363d; font-size: 0.78rem; flex-wrap: wrap;
  }
  .layer-bar label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
  #layerStatus { color: #484f58; margin-left: auto; }
  #map { flex: 1; }
  .panel {
    position: absolute; top: 84px; width: 300px; background: #161b22;
    border: 1px solid #30363d; border-radius: 10px; padding: 12px; z-index: 1000;
    display: none; max-height: calc(100vh - 120px); overflow-y: auto; font-size: 0.82rem;
  }
  .panel.show { display: block; }
  #infoPanel { right: 16px; }
  #searchPanel { left: 16px; }
  .panel-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: 600; }
  .panel-header button { background: none; border: 1px solid #30363d; color: #8b949e; padding: 2px 8px; }
  .row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #21262d; gap: 8px; }
  .row span:first-child { color: #8b949e; }
  .name { font-size: 1.05rem; font-weight: 700; margin-bottom: 6px; }
  .search-result { padding: 6px 0; border-bottom: 1px solid #21262d; cursor: pointer; }
  .search-result:hover { background: #1f2937; }
  #corsNote { font-size: 0.7rem; color: #484f58; padding: 4px 14px; }
</style>
</head>
<body>
  <div class="topbar">
    <h1>PTILES wasm demo</h1>
    <select id="stateSelect"></select>
    <input id="searchInput" placeholder="Search businesses..." />
    <button id="btnSearch">Search</button>
    <span id="status"></span>
  </div>
  <div class="layer-bar">
    <label><input type="checkbox" class="layer-toggle" data-layer="roads" checked> Roads</label>
    <label><input type="checkbox" class="layer-toggle" data-layer="water" checked> Water</label>
    <label><input type="checkbox" class="layer-toggle" data-layer="parks"> Parks</label>
    <label><input type="checkbox" class="layer-toggle" data-layer="rail"> Rail</label>
    <label><input type="checkbox" class="layer-toggle" data-layer="buildings"> Buildings</label>
    <span id="layerStatus"></span>
  </div>
  <div id="map"></div>

  <div class="panel" id="infoPanel">
    <div class="panel-header"><span>Nearest road</span><button id="btnCloseInfo">Close</button></div>
    <div id="infoBody"></div>
  </div>

  <div class="panel show" id="searchPanel">
    <div class="panel-header"><span>Business search</span></div>
    <div id="searchResults"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
