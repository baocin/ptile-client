[package]
name = "ptiles-cli"
version = "0.1.0"
edition = "2021"
description = "Rookery bridge: JSON-lines --serve mode + one-shot lat/lon query over ptiles-core"

[[bin]]
name = "ptiles-cli"
path = "src/main.rs"

[dependencies]
ptiles-core = { path = "../core", features = ["std", "serde", "http"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# pico-args over clap: this binary is a thin JSON-lines bridge with a handful
# of flags (--serve, --path, --lat, --lon, --data-dir). pico-args has zero
# dependencies and a tiny footprint, matching the workspace's "no unnecessary
# std/dep weight" stance; clap's derive machinery and help/completion
# generation are unneeded here.
pico-args = "0.5.0"
