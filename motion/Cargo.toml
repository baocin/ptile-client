[package]
name = "ptiles-motion"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Stateful GPS motion classification (stationary/walking/driving) built on ptiles-core"

[dependencies]
# `default-features = false` so the motion classifier inherits ptiles-core's
# no_std+alloc mode; the `std` feature below re-enables std on core. Only the
# `Fix` type and `haversine_distance_m` are used (both always compiled, and
# haversine already routes its trig through libm under no_std), so this crate
# needs no direct `libm`/transcendental dependency of its own.
ptiles-core = { path = "../core", default-features = false }
serde = { version = "1", default-features = false, features = ["derive"], optional = true }

[features]
default = ["std"]
std = ["ptiles-core/std"]
# Serialize/deserialize the movement types (used by the wasm + ffi wrappers).
serde = ["dep:serde", "ptiles-core/serde"]

# The integration tests replay real GPX traces and decode a real roads block,
# so they need core's `std` file/decoder surface directly -- `Fix` alone comes
# through this crate's own re-export.
[dev-dependencies]
ptiles-core = { path = "../core", features = ["std"] }
