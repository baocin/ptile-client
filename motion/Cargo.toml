[package]
name = "ptiles-motion"
version = "0.1.0"
edition = "2021"
description = "Stateful GPS motion classification (stationary/walking/driving) built on ptiles-core"

[dependencies]
# `default-features = false` so the motion classifier inherits ptiles-core's
# no_std+alloc mode; the `std` feature below re-enables std on core. Only the
# `Fix` type and `haversine_distance_m` are used (both always compiled, and
# haversine already routes its trig through libm under no_std), so this crate
# needs no direct `libm`/transcendental dependency of its own.
ptiles-core = { path = "../core", default-features = false }

[features]
default = ["std"]
std = ["ptiles-core/std"]
