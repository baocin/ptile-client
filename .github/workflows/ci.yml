name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      # An earlier version of this comment claimed real_layers.rs simply skips
      # on a runner. It does not, and this job was red because of it: the
      # individual cases skip, but `layer_coverage_is_asserted_somewhere`
      # deliberately FAILS when nothing was found, so that an empty data
      # directory cannot pass for real coverage.
      #
      # That guard is right and stays. What it needed was fixtures, which
      # conformance/corpus/ now provides -- committed slices of the real
      # published layers, last in SEARCH_DIRS so full local data still wins.
      - run: cargo test --workspace

  no_std:
    name: core builds no_std
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      # core claims no_std + alloc. Nothing checked it, so a std-only call
      # could land in the one crate that must not have them.
      - run: cargo build -p ptiles-core --no-default-features --target thumbv7em-none-eabihf

  wasm:
    name: wasm builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p ptiles-wasm --target wasm32-unknown-unknown --release

  bindings_fresh:
    name: ffi bindings are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The bindings in ffi/bindings/ are generated from ffi/src/lib.rs. They
      # were once 17 days and ~2,000 lines behind it -- missing
      # nearest_intersection, search_business, AdminLayer and AddressLayer --
      # and nothing noticed, because generated code that is committed looks
      # exactly as current as code that is maintained.
      #
      # Regenerate and require the tree to be unchanged.
      #
      # swift-format, ktlint and yapf are deliberately NOT installed: the
      # bindgen skips formatting when they are missing, which is how the
      # committed files were produced. Installing one here would reformat the
      # output and fail this check on whitespace alone.
      - run: cargo build -p ptiles-ffi
      - name: Regenerate all three languages
        run: |
          for lang in swift kotlin python; do
            cargo run -q -p ptiles-ffi --bin uniffi-bindgen --features uniffi/cli -- \
              generate --library target/debug/libptiles_ffi.so \
              --language "$lang" --out-dir "ffi/bindings/$lang"
          done
      - name: Fail if the committed bindings differ
        run: |
          if ! git diff --exit-code --stat ffi/bindings/; then
            echo
            echo "ffi/bindings/ is out of date with ffi/src/lib.rs."
            echo "Regenerate locally and commit the result:"
            echo
            echo "  cargo build -p ptiles-ffi"
            echo "  for lang in swift kotlin python; do \\"
            echo "    cargo run -p ptiles-ffi --bin uniffi-bindgen --features uniffi/cli -- \\"
            echo "      generate --library target/debug/libptiles_ffi.so \\"
            echo "      --language \$lang --out-dir ffi/bindings/\$lang; done"
            exit 1
          fi

  python_binding:
    name: python binding loads and decodes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p ptiles-ffi
      # Importing is a real check: the generated module resolves symbols out of
      # the cdylib at import time, so a binding/library mismatch fails here
      # rather than at the first call.
      - name: Import the generated module against the built library
        run: |
          cp target/debug/libptiles_ffi.so ffi/bindings/python/
          cd ffi/bindings/python
          python3 -c "
          import ptiles_ffi as p
          for n in ('PtilesLayer', 'AdminLayer', 'AddressLayer', 'PtilesStack', 'PtilesError'):
              assert hasattr(p, n), f'missing {n}'
          print('ok: all types present')
          "

  js:
    name: node tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # business_differential.test.mjs needs a real wasm build to compare the
      # hand-rolled JS decoders against. Building it here is also the only
      # coverage the npm packaging path gets: `cargo build --target wasm32`
      # in the `wasm` job proves the crate compiles, not that wasm-bindgen
      # can generate a usable package from it.
      - name: Install wasm-pack
        run: curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
      - name: Build the node-target wasm package
        run: wasm-pack build wasm --target nodejs --out-dir ../wasm-pkg --release
      # These extract the reader functions out of demo/index.html and run them
      # against synthetic fixtures, then against the real bytes in
      # conformance/corpus/. `fixtures_were_actually_exercised` fails if no
      # real file was parsed -- it is the JS half of the same guard that made
      # the cargo test job red, and it is satisfied by the corpus, not waived.
      - run: node --test "demo/test/*.test.mjs"
      # web-demo/ reads through wasm only, so its tests exercise the shipping
      # module itself rather than functions scraped out of an HTML file.
      - run: node --test "web-demo/test/*.test.mjs"
      # Not a `node --test` file and not under either glob above, so for its
      # whole life this ran on no machine. It compares every decoder against
      # the Python reference output in test-fixtures/golden/ -- the only
      # cross-implementation check in the repo -- and it exits non-zero on a
      # mismatch, so it is a real gate rather than a log.
      - run: node wasm/test/golden.mjs

  conformance:
    name: conformance corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The corpus is the cross-language contract: committed slices of real
      # published layers, each carrying a layout the readers must agree on.
      # Run separately from `cargo test` so a corpus regression is legible on
      # its own rather than buried in 435 results.
      #
      # This job does NOT run conformance/slice.py -- that reads machine-local
      # published data which no runner has. CI consumes only its output.
      - run: cargo test -p ptiles-core --test conformance_corpus -- --nocapture
