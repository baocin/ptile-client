[package]
name = "ptiles-core"
version = "0.1.0"
edition = "2021"
description = "no_std-optional decoder library for the PTiles geospatial format"

[dependencies]
h3o = { version = "0.10.0", default-features = false }
ruzstd = { version = "0.8.3", default-features = false }
thiserror = { version = "2.0.18", default-features = false }
serde = { version = "1", features = ["derive"], optional = true }
# sin/cos/sqrt/atan2 aren't in libcore (they need libm or std); h3o itself
# takes the same libm-under-no_std approach (see h3o's src/math/functions-libm.rs).
libm = "0.2"

# Accent-folding for business-name search (fold_name in business_search.rs):
# NFD decomposition so diacritics can be stripped. `default-features = false`
# keeps it no_std (it uses `alloc` internally) so `ptiles-core --no-default-features`
# still builds.
unicode-normalization = { version = "0.1", default-features = false }

# `http` feature: HttpSource (PtilesSource over HTTP Range requests). ureq
# chosen over reqwest/hyper/isahc/attohttpc: no async runtime (this workspace
# is sync-only everywhere -- CLI, FFI, tests), rustls-by-default (no OpenSSL/
# native-tls system dep to shell out to), small dependency footprint matching
# the workspace's "no unnecessary std/dep weight" stance (see cli/Cargo.toml's
# pico-args justification), and a blocking `Agent` that pools/reuses
# connections out of the box -- exactly the connection-reuse requirement for
# this task. No other HTTP client exists anywhere in this workspace yet.
ureq = { version = "3", optional = true }

[dev-dependencies]
serde_json = "1"

[features]
default = ["std"]
std = ["thiserror/std", "h3o/std", "ruzstd/std"]
serde = ["dep:serde", "h3o/serde"]
# HttpSource needs a real Read/blocking-IO stack (std) plus ureq itself.
http = ["std", "dep:ureq"]
